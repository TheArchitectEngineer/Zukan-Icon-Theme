%YAML 1.2
---
name: Gradle
preferences:
  scope: source.shell.bash.gradle, source.dosbatch.gradle, source.groovy.gradle, source.Kotlin.gradle
  settings:
    icon: gradle
syntax:
  - name: Batch File (Gradle)
    scope: source.dosbatch.gradle
    hidden: true
    file_extensions:
    - gradlew.bat
    contexts:
      main:
        - include: scope:source.dosbatch
          apply_prototype: true
  - name: Bash (Gradle)
    scope: source.shell.bash.gradle
    hidden: true
    file_extensions:
    - gradlew
    contexts:
      main:
        - include: scope:source.shell.bash
          apply_prototype: true
  - name: Groovy (Gradle)
    scope: source.groovy.gradle
    hidden: true
    file_extensions:
    - gradle
    contexts:
      main:
        - include: scope:source.groovy
          apply_prototype: true
  - name: Kotlin (Gradle)
    scope: source.Kotlin.gradle
    hidden: true
    file_extensions:
    - gradle.kts
    contexts:
      main:
        - include: scope:source.Kotlin
          apply_prototype: true

# ST Package
